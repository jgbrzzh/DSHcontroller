name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build and verify portable Windows package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Purge stale Actions artifacts (one-time maintenance)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'chore: purge stale Actions artifacts')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $deleted = 0
          do {
            $response = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GH_REPO/actions/artifacts?per_page=100&name=DSHcontroller-win-x64"
            $artifacts = @($response.artifacts)
            foreach ($artifact in $artifacts) {
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$env:GH_REPO/actions/artifacts/$($artifact.id)"
              Write-Host "Deleted artifact $($artifact.id) ($($artifact.size_in_bytes) bytes)"
              $deleted++
            }
          } while ($artifacts.Count -gt 0)
          Write-Host "Deleted $deleted stale DSHcontroller artifact(s)."
      - name: Upload portable package and source
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'chore: purge stale Actions artifacts')
        uses: actions/upload-artifact@v4
        with:
          name: DSHcontroller-win-x64
          path: |
            .state/portable-build/DSHcontroller-win-x64.zip
            .state/portable-build/DSHcontroller-source.zip
            .state/portable-build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          name: DSHcontroller-win-x64
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          test "$RELEASE_TAG" = "v$version"
          gh release create "$RELEASE_TAG" --verify-tag --title "DSHcontroller $RELEASE_TAG" --notes-file .github/release-notes.md release-assets/*
