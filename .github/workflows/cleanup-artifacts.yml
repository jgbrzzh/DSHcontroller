name: Cleanup stale Actions artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-artifacts.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stored Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deleted=0
          bytes=0
          while true; do
            response="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GH_REPO/actions/artifacts?per_page=100")"
            count="$(jq '.artifacts | length' <<<"$response")"
            [[ "$count" -gt 0 ]] || break
            while IFS=$'\t' read -r id size name; do
              [[ -n "$id" ]] || continue
              curl -fsSL -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GH_REPO/actions/artifacts/$id"
              echo "Deleted artifact $id: $name ($size bytes)"
              deleted=$((deleted + 1))
              bytes=$((bytes + size))
            done < <(jq -r '.artifacts[] | [.id, .size_in_bytes, .name] | @tsv' <<<"$response")
          done
          echo "Deleted $deleted artifact(s), $bytes bytes total."
